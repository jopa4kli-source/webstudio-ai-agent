/* Professional polish layer */
:root{

*{scrollbar-width:thin;scrollbar-color:#33445f transparent}

.title-actions{gap:8px}.top-btn{background:rgba(148,163,184,.1);border:1px solid transparent;color:#a9b6ca;font-size:11px;font-weight:700;padding:6px 10px;border-radius:7px}.top-btn:hover,.top-btn.active{background:rgba(109,124,255,.2);border-color:rgba(109,124,255,.45);color:#fff;transform:translateY(-1px)}

(() => {
  'use strict';

  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => [...root.querySelectorAll(selector)];
  const uid = () => `${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
  const pathParts = path => String(path || '').split('/').filter(Boolean);
  const normalizePath = path => '/' + pathParts(path).join('/');

  const starterFiles = {
    '/index.html': `<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>مشروعي</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <div id="app">\n    <h1>مرحباً بالعالم! 🌍</h1>\n    <p>هذا مشروعي الأول</p>\n    <button id="btn">اضغط هنا</button>\n  </div>\n  <script src="script.js"><\/script>\n</body>\n</html>`,
    '/style.css': `/* المشروع الرئيسي */\n* { margin: 0; padding: 0; box-sizing: border-box; }\nbody {\n  font-family: system-ui, sans-serif;\n  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);\n  min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white;\n}\n#app { text-align: center; }\nh1 { font-size: 2.5rem; margin-bottom: 1rem; }\np { font-size: 1.2rem; opacity: .8; margin-bottom: 2rem; }\nbutton { padding: 12px 32px; border: 0; border-radius: 8px; background: rgba(255,255,255,.2); color: white; font-size: 1.1rem; cursor: pointer; transition: .3s; }\nbutton:hover { background: rgba(255,255,255,.3); transform: translateY(-2px); }`,
    '/script.js': `// التطبيق الرئيسي\nconst btn = document.getElementById('btn');\nlet count = 0;\nbtn.addEventListener('click', () => {\n  count++;\n  btn.textContent = \`تم الضغط \${count} مرة\`;\n  btn.style.transform = 'scale(1.1)';\n  setTimeout(() => btn.style.transform = 'scale(1)', 200);\n});\nconsole.log('التطبيق جاهز! 🚀');`,
    '/README.md': `# مشروعي 🚀\n\nمحرر WebStudio يعمل محلياً من المتصفح.\n\n- افتح index.html للمعاينة\n- عدّل الملفات من المحرر\n- كل التغييرات تُحفظ في هذا المتصفح تلقائياً`
    , '/.webstudio/AGENT.md': `# WebStudio Agent Capabilities

## Role
Act as a careful coding agent inside the local WebStudio project. Read before editing, explain the plan, make the smallest safe change, then verify the result.

## Project operations
- Inspect the project tree and read any file before changing it.
- Search filenames and file contents with SEARCH_PROJECT.
- Search this capability file with SEARCH_CAPABILITIES whenever a task is unclear.
- Use CHECK_PROJECT and CHECK_LINKS before and after substantial changes.
- Open the changed file and report a concise change summary.

## Safe edit operations
- Use CREATE_FILE, WRITE_FILE, UPDATE_FILE for full-file changes.
- Use REPLACE_IN_FILE for an exact old-text replacement; it must match exactly once.
- Use REPLACE_LINE for a 1-based line replacement.
- Use INSERT_AFTER to insert content after an exact anchor.
- Every edit creates a local backup in the in-memory change history and is reversible in the current session.

## Testing
- Test the preview as a user: click buttons, submit forms, follow local links, and inspect visible results when browser automation is available.
- Use CHECK_PROJECT, CHECK_LINKS, and the preview console errors as evidence.
- Never claim a test passed without running it or clearly say it was static analysis only.

## Boundaries
- Control is limited to files, preview, and the internal WebStudio console.
- Never run operating-system shell commands, sudo, package managers, delete commands outside the project, or access private device files.
`
  };

  const welcome = 'مرحباً بك في WebStudio! 👋💻\n\nأنا مساعدك البرمجي بصلاحيات كاملة داخل مشروع المحرر. أستطيع إنشاء وتحديث وقراءة وفتح وحذف وإعادة تسمية الملفات والمجلدات، وكتابة الأكواد وتنفيذ تغييرات كبيرة أو صغيرة مباشرة.\n\nجرّب: `احذف script.js` أو `أعد تسمية style.css إلى main.css` أو `حدّث index.html`.\n\nبدون مفتاح Gemini سأعمل بوضع المحاكاة المحلي، ويمكنك إضافة المفتاح واختيار النموذج من الإعدادات.';

  const initialState = () => ({
    files: {...starterFiles}, folders: ['/src', '/src/components'], expanded: {'/src': true, '/src/components': false},
    openFiles: ['/index.html'], activeFile: '/index.html', showPreview: false, showTerminal: false,
    activeSidePanel: 'explorer', showChat: true, apiKey: 'worker-api', aiModel: 'llama-3.3-70b', apiEndpoint: 'https://ai-chat.jopa4kli.workers.dev/api/chat',
    conversations: [{id: uid(), title: 'محادثة جديدة', messages: [{id: uid(), role: 'assistant', content: welcome, timestamp: Date.now()}]}],
    activeConversation: null, terminal: [{id: uid(), type: 'system', text: 'WebStudio جاهز! اكتب "مساعدة" لعرض الأوامر المتاحة.'}]
  });

  let state;
  try { state = {...initialState(), ...(JSON.parse(localStorage.getItem('webstudio-local') || '{}'))}; }
  catch { state = initialState(); }
  state.files = state.files && Object.keys(state.files).length ? state.files : {...starterFiles};
  state.folders = Array.isArray(state.folders) ? state.folders : ['/src', '/src/components'];
  state.openFiles = Array.isArray(state.openFiles) && state.openFiles.length ? state.openFiles : ['/index.html'];
  state.conversations = Array.isArray(state.conversations) && state.conversations.length ? state.conversations : initialState().conversations;
  state.terminal = Array.isArray(state.terminal) ? state.terminal : initialState().terminal;
  if (!state.files['/.webstudio/AGENT.md']) state.files['/.webstudio/AGENT.md'] = starterFiles['/.webstudio/AGENT.md'];
  if (!state.apiEndpoint) state.apiEndpoint = 'https://ai-chat.jopa4kli.workers.dev/api/chat';

  const save = () => {
    try { localStorage.setItem('webstudio-local', JSON.stringify(state)); } catch {}
  };
  const fileName = path => pathParts(path).pop() || 'root';
  const ext = path => (fileName(path).split('.').pop() || '').toLowerCase();
  const parentPath = path => { const p = pathParts(path); p.pop(); return p.length ? '/' + p.join('/') : '/'; };
  const hasPath = path => !!state.files[normalizePath(path)] || state.folders.includes(normalizePath(path));
  const allPaths = () => [...state.folders, ...Object.keys(state.files)].sort((a,b) => a.localeCompare(b, 'ar'));

  function fileIcon(path) {
    const e = ext(path);
    const map = {html:['‹›','file-html'], css:['#','file-css'], js:['JS','file-js'], jsx:['JS','file-js'], ts:['TS','file-js'], tsx:['TS','file-js'], json:['{}','file-json'], md:['M','file-md'], png:['▧','file-img'], jpg:['▧','file-img'], jpeg:['▧','file-img'], svg:['◇','file-img']};
    const item = map[e] || ['·','file-default'];
    return `<span class="node-icon ${item[1]}">${item[0]}</span>`;
  }

  function visibleTree() {
    const children = {};
    allPaths().forEach(path => { const parent = parentPath(path); (children[parent] ||= []).push(path); });
    Object.values(children).forEach(list => list.sort((a,b) => { const af = state.files[a] !== undefined, bf = state.files[b] !== undefined; return af === bf ? a.localeCompare(b,'ar') : (af ? 1 : -1); }));
    const render = (parent, depth = 0) => (children[parent] || []).map(path => {
      const isFolder = state.folders.includes(path); const opened = !!state.expanded[path];
      const row = `<div class="tree-row ${state.activeFile === path ? 'selected' : ''}" data-path="${esc(path)}" data-kind="${isFolder ? 'folder' : 'file'}" style="padding-left:${8 + depth * 16}px">${isFolder ? `<span class="caret">${opened ? '▾' : '▸'}</span><span class="node-icon folder-icon">▰</span>` : '<span class="caret"></span>'}${isFolder ? '' : fileIcon(path)}<span class="node-name">${esc(fileName(path))}</span></div>`;
      return row + (isFolder && opened ? render(path, depth + 1) : '');
    }).join('');
    return render('/');
  }

  function renderExplorer() {
    return `<div class="panel-shell"><div class="panel-heading"><span>المستكشف</span><div class="heading-actions"><button class="icon-btn" id="new-file" title="ملف جديد">＋</button><button class="icon-btn" id="new-folder" title="مجلد جديد">▱</button></div></div><div class="tree-scroll" id="tree-scroll">${visibleTree() || '<div class="empty-side">لا توجد ملفات</div>'}</div></div>`;
  }

  function renderSearch() {
    return `<div class="panel-shell"><div class="panel-heading">بحث في الملفات</div><div class="search-wrap"><input id="file-search" placeholder="بحث في الملفات..." autocomplete="off"></div><div class="search-results" id="search-results"><div class="empty-side">اكتب للبحث داخل الملفات</div></div></div>`;
  }

  function renderSidePanel() {
    const side = $('#side-panel');
    if (state.activeSidePanel === 'none' || state.activeSidePanel === 'chat') { side.innerHTML = ''; side.style.display = 'none'; return; }
    side.style.display = ''; side.innerHTML = state.activeSidePanel === 'search' ? renderSearch() : renderExplorer();
    bindSideEvents();
  }

  function renderEditor() {
    const paths = state.openFiles.filter(p => state.files[p] !== undefined);
    const active = state.files[state.activeFile] !== undefined ? state.activeFile : (paths[0] || null);
    if (!active) return `<div class="empty-editor">افتح ملفاً من المستكشف للبدء</div>`;
    const numbers = String(state.files[active] || '').split('\n').map((_, i) => i + 1).join('\n');
    return `<div class="editor-shell"><div class="editor-tabs">${paths.map(path => `<div class="editor-tab ${path === active ? 'active' : ''}" data-tab="${esc(path)}">${fileIcon(path)}<span>${esc(fileName(path))}</span><button class="tab-close" data-close="${esc(path)}">×</button></div>`).join('')}</div><div class="editor-toolbar"><span dir="ltr" class="editor-path">${esc(active)}</span><span class="editor-toolbar-actions"><button id="copy-file" title="نسخ محتوى الملف">نسخ</button><button id="download-file" title="تنزيل الملف الحالي">تنزيل</button><span class="editor-type">${ext(active).toUpperCase() || 'TEXT'}</span></span></div><div class="editor-body"><pre class="line-numbers" id="line-numbers">${numbers}</pre><textarea class="code-editor" id="code-editor" spellcheck="false" aria-label="محرر الكود">${esc(state.files[active])}</textarea></div></div>`;
  }

  function buildPreview() {
    let html = state.files['/index.html'];
    if (!html) return `<html><body style="font-family:sans-serif;display:grid;place-items:center;height:100vh"><h2>لا يوجد ملف index.html</h2></body></html>`;
    html = html.replace(/<link([^>]+href=["']([^"']+\.css)["'][^>]*)>/gi, (m, attrs, href) => { const p = normalizePath(href.replace(/^\.\//,'')); return state.files[p] !== undefined ? `<style>/* ${esc(href)} */\n${state.files[p]}</style>` : ''; });
    html = html.replace(/<script([^>]+src=["']([^"']+\.js)["'][^>]*)><\/script>/gi, (m, attrs, src) => { const p = normalizePath(src.replace(/^\.\//,'')); return state.files[p] !== undefined ? `<script>/* ${esc(src)} */\n${state.files[p]}<\/script>` : ''; });
    const monitor = `<script>(function(){
      function report(type, value){ try { parent.postMessage({source:"webstudio-preview", type:type, message:String(value)}, "*"); } catch(e) {} }
      window.addEventListener("error", function(e){ report("error", (e.message || "Runtime error") + " @ " + (e.filename || "preview") + ":" + (e.lineno || "?")); });
      window.addEventListener("unhandledrejection", function(e){ report("error", "Unhandled promise rejection: " + (e.reason && e.reason.message || e.reason)); });
      var originalError = console.error; console.error = function(){ report("error", Array.prototype.slice.call(arguments).join(" ")); originalError.apply(console, arguments); };
    })();<\/script>`;
    return html.replace(/<\/body>/i, monitor + "<\/body>");
  }

  window.addEventListener("message", event => {
    if (!event.data || event.data.source !== "webstudio-preview") return;
    addTerminal(event.data.message, event.data.type === "error" ? "error" : "info");
    toast("تم تسجيل خطأ من المعاينة في الكونسول", "error");
  });

  function renderCenter() {
    const area = $('#editor-preview-area');
    if (state.showPreview) area.innerHTML = `<div class="split-pane">${renderEditor()}<div class="preview-shell"><div class="preview-head"><span>◉</span> معاينة مباشرة <span style="margin-left:auto;color:#6a6a6a">srcDoc</span></div><iframe class="preview-frame" sandbox="allow-scripts" title="معاينة مباشرة"></iframe></div></div>`;
    else area.innerHTML = renderEditor();
    bindEditorEvents();
    if (state.showPreview) { const frame = $('.preview-frame'); if (frame) frame.srcdoc = buildPreview(); }
  }

  function renderTerminal() {
    $('#terminal-panel').classList.toggle('hidden', !state.showTerminal);
    $('#terminal-output').innerHTML = state.terminal.map(line => `<div class="terminal-line ${line.type}">${esc(line.text)}</div>`).join('');
    const out = $('#terminal-output'); out.scrollTop = out.scrollHeight;
  }

  function activeConversation() { return state.conversations.find(c => c.id === state.activeConversation) || state.conversations[0]; }
  function formatMessage(text) {
    let safe = esc(text);
    safe = safe.replace(/```(\w*)\n?([\s\S]*?)```/g, (_m, lang, code) => `<pre>${esc(code.trim())}</pre>`);
    safe = safe.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>');
    return safe;
  }
  function renderChat() {
    const conv = activeConversation(); const messages = conv ? conv.messages : [];
    const conversationList = `<div class="conversation-list"><div class="conversation-caption">المحادثات (${state.conversations.length})</div>${state.conversations.map(c => `<div class="conversation-item ${c.id === state.activeConversation ? 'active' : ''}" data-conversation="${c.id}"><span>◌</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.title)}</span><button class="conv-delete" data-delete-conversation="${c.id}">×</button></div>`).join('')}</div>`;
    const messagesHtml = messages.map(m => `<div class="message ${m.role}"><div class="message-bubble"><div class="message-meta"><span>${m.role === 'user' ? '👤' : '🤖'}</span><span>${m.role === 'user' ? 'أنت' : 'المساعد'}</span><span>${new Date(m.timestamp).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</span></div><div class="message-content">${formatMessage(m.content)}</div>${m.commands?.length ? `<div class="command-list">⚡ أوامر نُفذت:<br>${m.commands.map(c => esc(c.type === 'DELETE' ? '- حذف ' + c.path : c.type === 'RENAME' ? '↔ إعادة تسمية ' + c.path + ' → ' + c.newName : c.type === 'OPEN_FILE' ? '▸ فتح ' + c.path : '+ ' + c.path)).join('<br>')}</div>` : ''}</div></div>`).join('');

    const files=Object.entries(state.files).filter(([p])=>p===source||p.startsWith(source+'/')); const folders=state.folders.filter(p=>p===source||p.startsWith(source+'/')); ensureParentFolders(destination); if (!state.folders.includes(destination)) state.folders.push(destination);

  function renamePath(path, newName) { const clean = String(newName || '').trim().replace(/[\\/]/g,''); if (!clean) return; const target = parentPath(path) === '/' ? '/' + clean : parentPath(path) + '/' + clean; if (hasPath(target)) return toast('الاسم مستخدم بالفعل', 'error'); if (state.files[path] !== undefined) { state.files[target] = state.files[path]; delete state.files[path]; } else { state.folders = state.folders.map(p => p === path || p.startsWith(path + '/') ? target + p.slice(path.length) : p); } state.openFiles = state.openFiles.map(p => p === path ? target : p); if (state.activeFile === path) state.activeFile = target; renderAll(); addTerminal(`تمت إعادة التسمية: ${path} → ${target}`, 'info'); }

  function parseCommands(text) { const commands=[]; let clean=text; let match; const fileRe=/\[(CREATE_FILE|WRITE_FILE|UPDATE_FILE):([^\]]+)\]([\s\S]*?)\[\/(?:CREATE_FILE|WRITE_FILE|UPDATE_FILE)\]/g; while ((match=fileRe.exec(text))) { commands.push({type:match[1],path:normalizePath(match[2]),content:match[3].trim()}); clean=clean.replace(match[0],''); } const folderRe=/\[(CREATE_FOLDER|MKDIR):([^\]]+)\]/g; while ((match=folderRe.exec(text))) { commands.push({type:'CREATE_FOLDER',path:normalizePath(match[2])}); clean=clean.replace(match[0],''); } const deleteRe=/\[(DELETE|REMOVE):([^\]]+)\]/g; while ((match=deleteRe.exec(text))) { commands.push({type:'DELETE',path:normalizePath(match[2])}); clean=clean.replace(match[0],''); } const renameRe=/\[RENAME:([^\]]+)\]([\s\S]*?)\[\/RENAME\]/g; while ((match=renameRe.exec(text))) { commands.push({type:'RENAME',path:normalizePath(match[1]),newName:match[2].trim()}); clean=clean.replace(match[0],''); } const openRe=/\[OPEN_FILE:([^\]]+)\]/g; while ((match=openRe.exec(text))) { commands.push({type:'OPEN_FILE',path:normalizePath(match[1])}); clean=clean.replace(match[0],''); } const agentRe=/\[(INSPECT_PROJECT|CHECK_PROJECT|CHECK_LINKS|READ_PROJECT|READ_FILE):?([^\]]*)\]/g; while ((match=agentRe.exec(text))) { commands.push({type:match[1],path:match[2].trim()}); clean=clean.replace(match[0],''); } const searchCapRe=/\[SEARCH_CAPABILITIES:?([^\]]*)\]/g; while ((match=searchCapRe.exec(text))) { commands.push({type:'SEARCH_CAPABILITIES',query:match[1].trim()}); clean=clean.replace(match[0],''); } const searchProjectRe=/\[SEARCH_PROJECT:([^\]]+)\]/g; while ((match=searchProjectRe.exec(text))) { commands.push({type:'SEARCH_PROJECT',query:match[1].trim()}); clean=clean.replace(match[0],''); } const replaceExactRe=/\[REPLACE_IN_FILE:([^\]]+)\]([\s\S]*?)\[\/OLD\]([\s\S]*?)\[\/NEW\]/g; while ((match=replaceExactRe.exec(text))) { commands.push({type:'REPLACE_IN_FILE',path:match[1].trim(),oldText:match[2],newText:match[3]}); clean=clean.replace(match[0],''); } const replaceLineRe=/\[REPLACE_LINE:([^:]+):(\d+)\]([\s\S]*?)\[\/REPLACE_LINE\]/g; while ((match=replaceLineRe.exec(text))) { commands.push({type:'REPLACE_LINE',path:match[1].trim(),lineNumber:match[2],newText:match[3]}); clean=clean.replace(match[0],''); } const insertAfterRe=/\[INSERT_AFTER:([^\]]+)\]([\s\S]*?)\[\/ANCHOR\]([\s\S]*?)\[\/CONTENT\]/g; while ((match=insertAfterRe.exec(text))) { commands.push({type:'INSERT_AFTER',path:match[1].trim(),anchor:match[2],content:match[3]}); clean=clean.replace(match[0],''); } const appendRe=/\[APPEND_FILE:([^\]]+)\]([\s\S]*?)\[\/APPEND_FILE\]/g; while ((match=appendRe.exec(text))) { commands.push({type:'APPEND_FILE',path:match[1].trim(),content:match[2]}); clean=clean.replace(match[0],''); } const copyRe=/\[COPY:([^\]]+)\]([^\[]+)\[\/COPY\]/g; while ((match=copyRe.exec(text))) { commands.push({type:'COPY',source:match[1].trim(),destination:match[2].trim()}); clean=clean.replace(match[0],''); } const moveRe=/\[MOVE:([^\]]+)\]([^\[]+)\[\/MOVE\]/g; while ((match=moveRe.exec(text))) { commands.push({type:'MOVE',source:match[1].trim(),destination:match[2].trim()}); clean=clean.replace(match[0],''); } const terminalRe=/\[TERMINAL:([^\]]+)\]/g; while ((match=terminalRe.exec(text))) { commands.push({type:'TERMINAL',command:match[1].trim()}); clean=clean.replace(match[0],''); } return {text:clean.trim(),commands}; }
  function projectTree() { return allPaths().join('\n'); }
  function localReply(message) {
    const m=message.trim(), lower=m.toLowerCase();
    const fileMatch=m.match(/(?:أنشئ|اعمل|create|creating)\s+(?:ملف\s+|file\s+)?([^\s]+\.(?:html|css|js|json|md|txt|jsx|tsx|ts|py))/i);
    if (fileMatch) { const name=fileMatch[1]; const e=ext(name); const templates={html:`<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${name}</title></head>\n<body>\n  <h1>مرحباً!</h1>\n</body>\n</html>`,css:`/* ${name} */\n* { box-sizing: border-box; }\nbody { font-family: system-ui, sans-serif; }`,js:`// ${name}\nconsole.log('Hello from ${name}');`,json:`{\n  "name": "my-project",\n  "version": "1.0.0"\n}`,md:`# مشروع جديد\n\nاكتب وصف المشروع هنا.`}; return `تم إنشاء الملف **${name}** بنجاح!\n\n[CREATE_FILE:${name}]${templates[e] || `// ${name}`}[/CREATE_FILE]`; }
    const folderMatch=m.match(/(?:أنشئ|اعمل|create)\s+(?:مجلد\s+|folder\s+)([^\s]+)/i); if(folderMatch) return `تم إنشاء المجلد **${folderMatch[1]}** بنجاح!\n\n[CREATE_FOLDER:${folderMatch[1]}]`;
    if (/^(مرحبا|أهلا|هلا|السلام|سلام|hi|hello|hey)/i.test(lower)) return 'مرحباً بك! 👋\n\nأنا مساعدك البرمجي المحلي. أستطيع إنشاء الملفات والمجلدات، شرح المفاهيم، وعرض هيكل المشروع. كيف أساعدك؟';
    const deleteMatch=m.match(/(?:احذف|امسح|delete|remove)\s+(?:(?:ال)?ملف|(?:ال)?مجلد|file|folder)?\s*([^\s]+)/i); if (deleteMatch) return `تم حذف **${deleteMatch[1]}** من المحرر.\n\n[DELETE:${normalizePath(deleteMatch[1])}]`;
    const renameMatch=m.match(/(?:أعد\s+تسمية|غير\s+اسم|rename)\s+([^\s]+)\s+(?:إلى|الى|to)\s+([^\s]+)/i); if (renameMatch) return `تمت إعادة تسمية **${renameMatch[1]}** إلى **${renameMatch[2]}**.\n\n[RENAME:${normalizePath(renameMatch[1])}]${renameMatch[2]}[/RENAME]`;
    const openMatch=m.match(/(?:افتح|open)\s+(?:الملف\s+|file\s+)?([^\s]+)/i); if (openMatch) return `سأفتح الملف **${openMatch[1]}** لك.\n\n[OPEN_FILE:${normalizePath(openMatch[1])}]`;
    if (/^(مساعدة|help|أوامر|commands)/i.test(lower)) return '📋 **صلاحياتي داخل المحرر:**\n\n• إنشاء أو تحديث ملف: `أنشئ ملف app.js`\n• إنشاء مجلد: `أنشئ مجلد components`\n• حذف ملف أو مجلد: `احذف ملف app.js`\n• إعادة تسمية: `أعد تسمية app.js إلى main.js`\n• فتح ملف وقراءة المشروع: `افتح style.css` أو `اعرض الملفات`\n• فحص المشروع والروابط: `[CHECK_PROJECT]` و`[CHECK_LINKS]`\n• قراءة مشروع أو ملف: `[INSPECT_PROJECT]` و`[READ_FILE:/index.html]`\n• كتابة وتعديل الأكواد وشرحها\n\nأتحكم في مشروع WebStudio الافتراضي فقط، وليس في ملفات نظام جهازك.';
    if (/اعرض\s*(?:ال)?ملفات|list\s*files|اعرض\s*(?:ال)?مشروع/i.test(lower)) return `📂 **هيكل المشروع:**\n\n\`\`\`\n${projectTree()}\n\`\`\``;
    if (/اشرح|explain|ما هو|what is/i.test(lower)) return 'يسعدني الشرح. اكتب اسم المفهوم بشكل أوضح، مثل: **اشرح Promise في JavaScript**.\n\nPromise يمثل نتيجة عملية غير متزامنة قد تنجح أو تفشل، ويمكن التعامل معها باستخدام `then` و`catch` أو `async/await`.';
    if (/زر|button/i.test(lower) && /اكتب|كود|write|code|اعمل/i.test(lower)) return 'إليك مثالاً سريعاً لزر تفاعلي:\n\n```html\n<button id="hello">اضغط هنا</button>\n<script>\ndocument.querySelector("#hello").onclick = () => alert("مرحباً!");\n<\/script>\n```';
    return 'شكراً لرسالتك! 🤔\n\nيمكنني مساعدتك في إنشاء الملفات والمجلدات، كتابة أمثلة JavaScript وHTML وCSS، شرح المفاهيم، أو استعراض ملفات المشروع. اكتب `مساعدة` لرؤية أمثلة الطلبات.';
  }
  async function callApi(messages) {
    const endpoint = state.apiEndpoint || 'https://ai-chat.jopa4kli.workers.dev/api/chat';
    const activeContent = state.activeFile && state.files[state.activeFile]
      ? state.files[state.activeFile].slice(0, 12000)
      : '(لا يوجد ملف نشط)';
    const terminalContext = (state.terminal || []).slice(-60).map(item => '[' + item.type + '] ' + item.text).join('\n') || '(لا توجد رسائل كونسول)';
    const editorContext = `حالة محرر WebStudio الحالية:\nالملف النشط: ${state.activeFile || '(لا يوجد)'}\nكل الملفات والمجلدات:\n${projectTree()}\nمحتوى الملف النشط:\n${activeContent}\n\nآخر أخطاء ورسائل الكونسول داخل المحرر:\n${terminalContext}`;
    const systemText = `أنت مساعد برمجي داخل محرر WebStudio المحلي. ساعد المستخدم في إنشاء وتعديل ملفات المشروع فقط. عند طلب تغيير ملفات، أرسل أوامر [CREATE_FILE:path]content[/CREATE_FILE] أو [WRITE_FILE:path]content[/WRITE_FILE] أو [UPDATE_FILE:path]content[/UPDATE_FILE] أو [CREATE_FOLDER:path] أو [DELETE:path] أو [RENAME:old-path]new-name[/RENAME] أو [OPEN_FILE:path] أو [TERMINAL:help]. وللتصرف كوكيل استخدم [INSPECT_PROJECT] لقراءة الهيكل، [READ_FILE:path] لقراءة ملف، [CHECK_PROJECT] لفحص الأخطاء، [CHECK_LINKS] لفحص الموارد. ابحث داخل المشروع بـ[SEARCH_PROJECT:query] وابحث في قدراتك بـ[SEARCH_CAPABILITIES:query]. للتعديل الدقيق استخدم [REPLACE_IN_FILE:path]النص القديم[/OLD]النص الجديد[/NEW] أو [REPLACE_LINE:path:رقم_السطر]النص الجديد[/REPLACE_LINE] أو [INSERT_AFTER:path]النص المرساة[/ANCHOR]المحتوى[/CONTENT]. لإنشاء مجلدات متداخلة استخدم [CREATE_FOLDER:/src/components/ui]، وللإضافة إلى ملف استخدم [APPEND_FILE:path]content[/APPEND_FILE]، وللنسخ أو النقل استخدم [COPY:source]destination[/COPY] و[MOVE:source]destination[/MOVE]، ثم نفذ الإصلاحات بأوامر الملفات. أوامر الكونسول آمنة وداخل المحرر فقط. اشرح النتيجة بالعربية. لا تنفذ أوامر نظام التشغيل أو shell خارج WebStudio.

${editorContext}`;
    const apiMessages = [
      { role: 'user', content: systemText },
      ...messages.map(message => ({ role: message.role, content: message.content }))
    ];
    const response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: apiMessages })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || `Worker API Error ${response.status}`);
    return data.response || 'لم يصل رد من Worker API.';
  }
  async function sendChat(text) { const conv=getConversation(); if(!conv) return; conv.messages.push({id:uid(),role:'user',content:text,timestamp:Date.now()}); if(conv.title==='محادثة جديدة') conv.title=text.slice(0,30); renderChatPanel(); save(); const placeholder={id:uid(),role:'assistant',content:'',timestamp:Date.now(),loading:true}; conv.messages.push(placeholder); renderChatPanel(); await new Promise(r=>setTimeout(r,650)); try { const raw=await callApi(conv.messages.filter(m=>!m.loading).map(m=>({role:m.role,content:m.content}))); const result=parseCommands(raw); Object.assign(placeholder,{content:result.text,commands:result.commands,loading:false}); result.commands.forEach(c=>{ if(c.type==='CREATE_FILE'||c.type==='WRITE_FILE'||c.type==='UPDATE_FILE') createFile(c.path,c.content || ''); else if(c.type==='CREATE_FOLDER') createFolder(c.path); else if(c.type==='DELETE') removePath(c.path); else if(c.type==='RENAME') renamePath(c.path,c.newName); else if(c.type==='OPEN_FILE') setActive(c.path); else if(c.type==='TERMINAL') runCommand(c.command); else if(c.type==='READ_FILE') agentReadFile(c.path); else if(c.type==='SEARCH_PROJECT') agentSearchProject(c.query); else if(c.type==='SEARCH_CAPABILITIES') agentSearchCapabilities(c.query); else if(c.type==='REPLACE_IN_FILE') agentReplaceExact(c.path,c.oldText,c.newText); else if(c.type==='REPLACE_LINE') agentReplaceLine(c.path,c.lineNumber,c.newText); else if(c.type==='INSERT_AFTER') agentInsertAfter(c.path,c.anchor,c.content); else if(c.type==='APPEND_FILE') appendFile(c.path,c.content); else if(c.type==='COPY') copyPath(c.source,c.destination); else if(c.type==='MOVE') movePath(c.source,c.destination); else if(c.type==='READ_PROJECT') agentInspectProject(); else if(c.type==='INSPECT_PROJECT') agentInspectProject(); else if(c.type==='CHECK_PROJECT') agentCheckProject(); else if(c.type==='CHECK_LINKS') agentCheckLinks(); }); } catch(e) { placeholder.content=`❌ خطأ: ${e.message || 'تعذر الاتصال'}`; placeholder.loading=false; } renderAll(); save(); }

  function agentSearchProject(query) {
    query = String(query || '').trim();
    if (!query) { addTerminal('اكتب عبارة للبحث داخل المشروع.', 'warning'); return; }
    const results=[]; const needle=query.toLowerCase();
    for (const [path, content] of Object.entries(state.files)) {
      const lines=String(content).split('\n');
      lines.forEach((line, index) => { if (line.toLowerCase().includes(needle)) results.push(`${path}:${index+1}: ${line.trim()}`); });
    }
    addTerminal(`نتائج البحث عن "${query}" (${results.length}):\n${results.slice(0,120).join('\n') || 'لا توجد نتائج'}`, results.length?'info':'warning');
  }
  function agentSearchCapabilities(query) {
    const content=state.files['/.webstudio/AGENT.md'] || '';
    if (!query) { addTerminal(content, 'info'); return; }
    const lines=content.split('\n').filter(line=>line.toLowerCase().includes(String(query).toLowerCase()));
    addTerminal(`نتائج البحث في ملف قدرات الوكيل (${lines.length}):\n${lines.join('\n') || 'لا توجد نتائج'}`, lines.length?'info':'warning');
  }
  function agentBackup(path) {
    state.agentBackups = state.agentBackups || [];
    state.agentBackups.push({path, content:state.files[path], at:new Date().toISOString()});
    state.agentBackups = state.agentBackups.slice(-50);
  }
  function agentReplaceExact(path, oldText, newText) {
    path=normalizePath(path); const current=state.files[path];
    if (current===undefined) { addTerminal(`لا يوجد ملف: ${path}`,'error'); return false; }
    const count=current.split(oldText).length-1;
    if (count !== 1) { addTerminal(`لم يتم التعديل: النص في ${path} يجب أن يظهر مرة واحدة فقط، وظهر ${count} مرة.`,'error'); return false; }
    agentBackup(path); state.files[path]=current.replace(oldText,newText); setActive(path); addTerminal(`تم استبدال نص مطابق مرة واحدة في ${path}`,'success'); return true;
  }
  function agentReplaceLine(path, lineNumber, newText) {
    path=normalizePath(path); const current=state.files[path]; const n=Number(lineNumber);
    if (current===undefined) { addTerminal(`لا يوجد ملف: ${path}`,'error'); return false; }
    const lines=current.split('\n'); if (!Number.isInteger(n) || n<1 || n>lines.length) { addTerminal(`رقم السطر غير صالح في ${path}: ${lineNumber}`,'error'); return false; }
    agentBackup(path); lines[n-1]=newText; state.files[path]=lines.join('\n'); setActive(path); addTerminal(`تم تعديل السطر ${n} في ${path}`,'success'); return true;
  }
  function agentInsertAfter(path, anchor, content) {
    path=normalizePath(path); const current=state.files[path];
    if (current===undefined) { addTerminal(`لا يوجد ملف: ${path}`,'error'); return false; }
    if (current.split(anchor).length-1 !== 1) { addTerminal(`مرساة الإدراج يجب أن تظهر مرة واحدة في ${path}`,'error'); return false; }
    agentBackup(path); state.files[path]=current.replace(anchor, anchor+'\n'+content); setActive(path); addTerminal(`تم الإدراج بعد النص المحدد في ${path}`,'success'); return true;
  }
  function agentReadFile(path) {
    path = normalizePath(path);
    if (state.files[path] === undefined) { addTerminal(`لا يوجد ملف: ${path}`, 'error'); return; }
    addTerminal(`--- ${path} ---\n${state.files[path].slice(0, 18000)}`, 'info');
  }
  function agentInspectProject() {
    const files = Object.entries(state.files);
    const summary = files.map(([path, content]) => `${path} (${content.length} حرف)`).join('\n');
    const codeFiles = files.filter(([path]) => /\.(html?|css|js|jsx|ts|tsx|json)$/i.test(path));
    addTerminal(`تحليل المشروع:\nالملفات: ${files.length}\nالمجلدات: ${state.folders.length}\nملفات الكود: ${codeFiles.length}\nالملف النشط: ${state.activeFile || '(لا يوجد)'}\n\n${summary}`, 'info');
  }
  function agentCheckProject() {
    const issues=[]; const warnings=[];
    const html=state.files['/index.html'] || '';
    if (!html) issues.push('لا يوجد /index.html');
    else {
      if (!/<html[\s>]/i.test(html)) warnings.push('ملف index.html لا يحتوي على وسم html واضح');
      if (!/<meta[^>]+viewport/i.test(html)) warnings.push('لا يوجد meta viewport');
      const ids=[...html.matchAll(/\bid=["']([^"']+)["']/gi)].map(m=>m[1]);
      const duplicates=ids.filter((id,i)=>ids.indexOf(id)!==i); if (duplicates.length) issues.push('معرفات HTML مكررة: '+[...new Set(duplicates)].join(', '));
      const refs=[...html.matchAll(/(?:src|href)=["']([^"']+)["']/gi)].map(m=>m[1]).filter(x=>!/^([a-z]+:|\/\/|#|data:|mailto:|javascript:)/i.test(x));
      for (const ref of refs) { const path=normalizePath(ref.split('?')[0].replace(/^\.\//,'')); if (state.files[path]===undefined) issues.push(`مرجع غير موجود: ${ref}`); }
    }
    for (const [path,content] of Object.entries(state.files)) {
      if (/\.js$/i.test(path)) { if (/console\.error\s*\(/.test(content)) warnings.push(`${path}: يحتوي console.error`); if (/document\.getElementById\(['"]([^'"]+)/.test(content)) { const ids=[...content.matchAll(/getElementById\(['"]([^'"]+)/g)].map(m=>m[1]); for (const id of ids) if (html && !new RegExp(`id=["']${id}["']`).test(html)) warnings.push(`${path}: يستدعي عنصرًا غير موجود: ${id}`); } }
      if (/\.json$/i.test(path)) { try { JSON.parse(content); } catch(e) { issues.push(`${path}: JSON غير صالح`); } }
      if (/\.css$/i.test(path) && content.includes('{') && !content.includes('}')) issues.push(`${path}: CSS غير مكتمل أو ينقصه قوس إغلاق`);
    }
    const terminalErrors=(state.terminal||[]).filter(x=>x.type==='error').slice(-20).map(x=>x.text);
    if (terminalErrors.length) issues.push('أخطاء مسجلة في الكونسول:\n' + terminalErrors.join('\n'));
    const result=`فحص المشروع مكتمل — أخطاء: ${issues.length}، تحذيرات: ${warnings.length}\n${issues.length?'\nالأخطاء:\n- '+issues.join('\n- '):'لا توجد أخطاء ثابتة مكتشفة.'}${warnings.length?'\n\nالتحذيرات:\n- '+warnings.join('\n- '):''}`;
    addTerminal(result, issues.length?'error':'success');
    return result;
  }
  function agentCheckLinks() {
    const html=state.files['/index.html']||''; const links=[...html.matchAll(/(?:href|src)=["']([^"']+)["']/gi)].map(m=>m[1]);
    const local=links.filter(x=>!/^([a-z]+:|\/\/|#|data:|mailto:|javascript:)/i.test(x)); const external=links.filter(x=>/^https?:\/\//i.test(x));
    const missing=local.filter(x=>state.files[normalizePath(x.split('?')[0].replace(/^\.\//,''))]===undefined);
    const result=`فحص الروابط والموارد:\nالإجمالي: ${links.length}\nمحلية: ${local.length}\nخارجية: ${external.length}\nمفقودة: ${missing.length}${missing.length?'\\n'+missing.join('\\n'):''}`;
    addTerminal(result, missing.length?'error':'success'); return result;
  }
  function runCommand(command) { const raw=command.trim(); if(!raw) return; addTerminal(`$ ${raw}`,'system'); const lower=raw.toLowerCase(); if(lower==='clear'||lower==='cls'){state.terminal=[];renderTerminal();save();return;} if(lower==='help'||lower==='مساعدة'){addTerminal('الأوامر: help, clear, ls, tree, pwd, cat <file>, touch <file>, mkdir <folder>, append <file> <text>, cp <source> <destination>, mv <source> <destination>, rm <path>, open <file>, echo <text>','info');return;} if(lower==='pwd'){addTerminal('/workspace','info');return;} if(lower==='ls'||lower==='dir'||lower==='tree'){addTerminal(allPaths().join('\n'),'info');return;} if(lower.startsWith('cat ')||lower.startsWith('type ')){const p=normalizePath(raw.split(/\s+/).slice(1).join(' ')); addTerminal(state.files[p] ?? `الملف غير موجود: ${p}`,'info');return;} if(lower.startsWith('touch ')){createFile(raw.slice(6).trim(),''); return;} if(lower.startsWith('mkdir ')){createFolder(raw.slice(6).trim()); return;} if(lower.startsWith('rm ')||lower.startsWith('del ')){removePath(raw.split(/\s+/).slice(1).join(' ')); return;} if(lower.startsWith('mv ')){const parts=raw.split(/\s+/); if(parts.length>=3) renamePath(parts[1],parts.slice(2).join(' ')); else addTerminal('الصيغة: mv <old> <new>','warning'); return;} if(lower.startsWith('open ')){setActive(raw.slice(5).trim()); return;} if(lower.startsWith('echo ')){addTerminal(raw.slice(5),'info');return;} if(lower.startsWith('append ')){const parts=raw.split(/\s+/); if(parts.length>=3) appendFile(parts[1],parts.slice(2).join(' ')); else addTerminal('الصيغة: append <file> <text>','warning'); return;} if(lower.startsWith('cp ')){const parts=raw.split(/\s+/); if(parts.length>=3) copyPath(parts[1],parts[2]); else addTerminal('الصيغة: cp <source> <destination>','warning'); return;} addTerminal(`أمر غير معروف: ${raw}. اكتب "مساعدة" للمساعدة.`,'warning'); }

  function toast(message, type='') { const stack=$('#toast-stack'); const el=document.createElement('div'); el.className=`toast ${type}`; el.textContent=message; stack.appendChild(el); setTimeout(()=>el.remove(),2600); }
  async function copyToClipboard(text) { try { await navigator.clipboard.writeText(text); toast('تم نسخ المحتوى', 'success'); } catch { const area=document.createElement('textarea'); area.value=text; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove(); toast('تم نسخ المحتوى', 'success'); } }
  function downloadText(name, text) { const blob=new Blob([text],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),500); }
  async function downloadProject() {
    try {
      if (!window.fflate || !window.fflate.zipSync) throw new Error('مكتبة ZIP لم تُحمّل بعد. تحقق من اتصال الإنترنت ثم أعد المحاولة.');
      const files = {};
      Object.entries(state.files).forEach(([path, content]) => { files[path.replace(/^\//, '') || 'index.html'] = new TextEncoder().encode(content); });
      files['webstudio-project.json'] = new TextEncoder().encode(JSON.stringify({version:1, exportedAt:new Date().toISOString(), folders:state.folders, activeFile:state.activeFile, files:state.files}, null, 2));
      const archive = window.fflate.zipSync(files, {level:6});
      const blob = new Blob([archive], {type:'application/zip'});
      const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='webstudio-project.zip'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      addTerminal('تم تصدير جميع ملفات المشروع إلى webstudio-project.zip','success'); toast('تم تنزيل ملف ZIP للمشروع','success');
    } catch(error) { addTerminal('فشل تصدير ZIP: '+error.message,'error'); toast(error.message,'error'); }
  }
  function backupProject() { const backup={version:1,exportedAt:new Date().toISOString(),files:state.files,folders:state.folders,activeFile:state.activeFile}; downloadText('webstudio-backup.json', JSON.stringify(backup,null,2)); addTerminal('تم إنشاء نسخة احتياطية للمشروع.','success'); toast('تم حفظ النسخة الاحتياطية', 'success'); }
  function resetWorkspace() { if (!confirm('سيتم حذف مشروع WebStudio المحفوظ في هذا المتصفح وإعادته للحالة الافتراضية. هل تريد المتابعة؟')) return; localStorage.removeItem('webstudio-local'); location.reload(); }

  function openPalette() { $('#command-modal').classList.remove('hidden'); $('#command-search').value=''; renderCommands(''); $('#command-search').focus(); }
  const commandItems=[['معاينة مباشرة','toggle-preview'],['فتح الطرفية','toggle-terminal'],['فتح الشات','toggle-chat'],['مستكشف الملفات','panel-explorer'],['بحث في الملفات','panel-search'],['تصدير المشروع كملف ZIP','download']];
  function renderCommands(query) { const list=$('#command-list'); list.innerHTML=commandItems.filter(x=>x[0].includes(query)).map(x=>`<div class="command-option" data-command="${x[1]}">${x[0]}</div>`).join(''); $$('.command-option').forEach(el=>el.addEventListener('click',()=>{const cmd=el.dataset.command; $('#command-modal').classList.add('hidden'); if(cmd==='toggle-preview'){state.showPreview=!state.showPreview;renderAll();} if(cmd==='toggle-terminal'){state.showTerminal=!state.showTerminal;renderAll();} if(cmd==='toggle-chat'){state.showChat=!state.showChat;renderAll();} if(cmd==='panel-explorer'||cmd==='panel-search'){state.activeSidePanel=cmd==='panel-search'?'search':'explorer';renderAll();} if(cmd==='download')downloadProject();})); }

  $$('.activity[data-panel]').forEach(btn=>btn.addEventListener('click',()=>{ const panel=btn.dataset.panel; if(panel==='chat'){state.showChat=!state.showChat; if(state.showChat)state.activeSidePanel='chat';} else {state.activeSidePanel=state.activeSidePanel===panel?'none':panel;} renderAll(); }));
  $('#terminal-toggle').addEventListener('click',()=>{state.showTerminal=!state.showTerminal;renderAll();});
  $('#chat-toggle').addEventListener('click',()=>{state.showChat=!state.showChat;renderAll();});
  $('#preview-btn').addEventListener('click',()=>{state.showPreview=!state.showPreview;renderAll();});
  $('#download-btn').addEventListener('click',downloadProject);
  $('#backup-btn')?.addEventListener('click',backupProject);
  $('#reset-btn')?.addEventListener('click',resetWorkspace);
  $('#palette-btn').addEventListener('click',openPalette);
  $('#close-command').addEventListener('click',()=>$('#command-modal').classList.add('hidden'));
  $('#command-search').addEventListener('input',e=>renderCommands(e.target.value));
  $('#command-modal').addEventListener('click',e=>{if(e.target.id==='command-modal')e.currentTarget.classList.add('hidden');});
  $('#terminal-input').addEventListener('keydown',e=>{if(e.key==='Enter'){runCommand(e.target.value);e.target.value='';}});
  $('#clear-terminal').addEventListener('click',()=>{state.terminal=[];renderTerminal();save();});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&e.key.toLowerCase()==='p'){e.preventDefault();openPalette();} if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();toast('تم حفظ المشروع محلياً','success');} if(e.key==='Escape'){$('#command-modal').classList.add('hidden');}});

  renderAll();
})();

  </script>
